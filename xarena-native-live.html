<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XARENA Live</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head><body>
<div id="p"></div>
<script>
var q=new URLSearchParams(location.search);
var v=(q.get('v')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,20);
if(v){
  var f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v)+'?autoplay=1&mute=1&playsinline=1&rel=0';
  f.allow='autoplay; encrypted-media; picture-in-picture';
  f.setAttribute('allowfullscreen','');
  document.getElementById('p').appendChild(f);
}
</script>
</body></html>
