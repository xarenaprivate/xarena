<!DOCTYPE html>
<html lang="en">
<head>
<link rel="canonical" href="https://xarenaprivate.github.io/xarena/os.html">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hybrid OS · XARENA ESPORTS</title>
<meta name="description" content="XARENA Hybrid OS — the whole esports platform as a gaming OS: app grid, live widgets, dock and floating windows.">
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/os.css">
</head>
<body class="os-body">
<style>
#xr-splash{position:fixed;inset:0;z-index:99999;background:#07070f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;transition:opacity .3s ease;overflow:hidden}
#xr-splash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
#xr-splash .xs-stage{position:relative;width:118px;height:118px;display:flex;align-items:center;justify-content:center}
#xr-splash .xs-ring{position:absolute;inset:0;animation:xsSpin 2.6s linear infinite}
#xr-splash .xs-ring circle{fill:none;stroke:var(--xs-acc,#e10600);stroke-width:2.5;stroke-dasharray:44 22;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--xs-acc,#e10600))}
#xr-splash .xs-ring.r2{animation:xsSpinR 3.8s linear infinite;inset:9px}
#xr-splash .xs-ring.r2 circle{stroke-dasharray:10 30;opacity:.55;stroke-width:1.5}
#xr-splash .xs-logo{width:62px;height:62px;animation:xsPulse 1.2s ease-in-out infinite}
#xr-splash .xs-logo path{stroke:var(--xs-acc,#e10600)}
#xr-splash .xs-logo .xs-x{stroke:#f5b301}
#xr-splash .xs-name{font:900 24px Orbitron,system-ui,sans-serif;color:#fff;letter-spacing:7px;margin-left:7px;animation:xsGlitch 2.4s steps(1) infinite}
#xr-splash .xs-tag{font:800 10px Orbitron,system-ui,sans-serif;letter-spacing:5px;color:var(--xs-acc,#e10600);margin-left:5px;text-shadow:0 0 10px var(--xs-acc,#e10600)}
#xr-splash .xs-tip{font:600 12.5px Rajdhani,system-ui,sans-serif;color:#9aa0b8;letter-spacing:1px;min-height:16px;text-align:center;padding:0 24px;transition:opacity .25s}
#xr-splash .xs-bar{width:170px;height:3px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
#xr-splash .xs-bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--xs-acc,#e10600);box-shadow:0 0 12px var(--xs-acc,#e10600);animation:xsFill 1.5s ease forwards}
#xr-splash.xs-done{opacity:0;pointer-events:none}
@keyframes xsSpin{to{transform:rotate(360deg)}}
@keyframes xsSpinR{to{transform:rotate(-360deg)}}
@keyframes xsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes xsFill{to{width:88%}}
@keyframes xsGlitch{0%,93%,100%{text-shadow:none}94%{text-shadow:-2px 0 var(--xs-acc,#e10600),2px 0 #22d3ee}96%{text-shadow:2px 0 var(--xs-acc,#e10600),-2px 0 #22d3ee}98%{text-shadow:none}}
@media (prefers-reduced-motion:reduce){#xr-splash .xs-ring,#xr-splash .xs-logo,#xr-splash .xs-name,#xr-splash .xs-bar i{animation:none!important}#xr-splash{transition:none!important}}
</style>
<div id="xr-splash" role="status" aria-label="Loading XARENA">
<div class="xs-stage">
<svg class="xs-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47"/></svg>
<svg class="xs-ring r2" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47"/></svg>
<svg class="xs-logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 36 10v14c0 8-7 12.7-16 14C11 36.7 4 32 4 24V10Z" fill="#0b0b14" stroke-width="2.5"/><path class="xs-x" d="M13 13l14 14M27 13L13 27" stroke-width="3.2" fill="none"/></svg>
</div>
<div class="xs-name">XARENA</div>
<div class="xs-tag">BOOTING HYBRID OS</div>
<div class="xs-tip" id="xs-tip"></div>
<div class="xs-bar"><i></i></div>
<script>(function(){try{var m={liquid:"#0a84ff",classic:"#e10600","3d":"#8b3dff",nexus:"#7c5cff",arena:"#ff7a1a","void":"#a970ff",ascend:"#19e3c2",hybrid:"#22d3ee",pulse:"#ff2e88",aura:"#8b5cf6",social:"#0095f6"};var t=localStorage.getItem("xr_theme")||"liquid";var s=document.getElementById("xr-splash");if(s&&m[t])s.style.setProperty("--xs-acc",m[t]);var tips=["Season 1 - 48 squad slots - registrations open","Real tournaments - tracked rankings - live World Chat","Tip: mention @luna in World Chat - she answers","Tip: finish tasks to earn points, badges and titles","48 squads. One crown. Season 1 is loading"];var tip=document.getElementById("xs-tip");if(tip&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){var i=Math.floor(Math.random()*tips.length);tip.textContent=tips[i];var iv=setInterval(function(){if(!document.getElementById("xr-splash")){clearInterval(iv);return;}i=(i+1)%tips.length;tip.style.opacity=0;setTimeout(function(){tip.textContent=tips[i];tip.style.opacity=1;},240);},1600);}}catch(e){}})();</script>
</div>
<div class="os-wall"></div>
<div class="os-gloworb a"></div><div class="os-gloworb b"></div>
<main class="os-desktop">
  <div class="os-topbar">
    <div class="os-logo"><img src="assets/icon-192.png" alt="XARENA">XARENA <em>OS</em></div>
    <div class="os-clock"><div class="t" id="os-time">--:--</div><div class="d" id="os-date">loading</div></div>
  </div>
  <section class="os-widgets">
    <div class="os-widget purp" data-os-app="tournaments"><div class="wl"><i></i>Next up</div><div class="wb" id="os-w-tourn">Loading…</div></div>
    <div class="os-widget" data-os-app="tasks"><div class="wl"><i></i>Tasks</div><div class="wb" id="os-w-tasks">Loading…</div></div>
    <div class="os-widget red" data-os-app="leaderboard"><div class="wl"><i></i>Task score leaders</div><div class="wb" id="os-w-score">Loading…</div></div>
    <div class="os-widget" data-os-app="luna"><div class="wl"><i></i>Luna</div><div class="wb">Ask Luna anything about XARENA.</div><div class="ws">Tournaments, registration, tasks, rules — she knows it all.</div></div>
  </section>
  <div class="os-grid-label">Apps</div>
  <section class="os-grid" id="os-grid"></section>
  <p style="color:var(--osd-muted);font-size:12px">XARENA ESPORTS · Founded &amp; owned by Shivhari Rajput</p>
</main>
<nav class="os-dock">
  <button type="button" id="os-home" title="Home">🏠</button>
  <button type="button" data-os-app="tournaments" title="Tournaments">🏆</button>
  <button type="button" data-os-app="chat" title="World Chat">💬<span class="dot" id="os-chat-dot"></span></button>
  <button type="button" data-os-app="tasks" title="Tasks">✅</button>
  <button type="button" data-os-app="luna" title="Luna">✨</button>
  <button type="button" data-os-app="profile" title="Profile">👤</button>
  <span class="sep" id="os-dock-sep" style="display:none"></span>
  <span id="os-dock-tasks" style="display:flex;gap:8px"></span>
  <span class="sep"></span>
  <button type="button" id="os-exit" class="exit" title="Exit Hybrid OS">⏻</button>
</nav>
<div id="os-windows"></div>
<script src="assets/js/os.js"></script>
</body>
</html>
