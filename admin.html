      <div class="overline">Owner only</div>

      <p class="fp-sub">This panel is for the XARENA owner. Every action is logged.</p>
      <form id="login-form" novalidate>
        <div class="field"><label for="a-email">Admin email</label><input id="a-email" type="email" autocomplete="username" data-req placeholder="you@example.com"><div class="err">Email is required.</div></div>
        <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="current-password" data-req placeholder="Your admin password"><div class="err">Password is required.</div></div>

<div id="adm-nova" style="display:none">
<style>
.anv{background:linear-gradient(165deg,#0c1120 0%,#0a0e1c 55%,#120a24 100%);border:1px solid rgba(240,180,41,.18);border-radius:18px;padding:16px 14px 86px;color:#eef1ff;position:relative;overflow:hidden}
.anv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.anv-brand{font-family:var(--font-d);font-weight:900;font-size:17px;letter-spacing:1px;color:#f0b429}
.anv-brand small{display:block;font-family:var(--font-b);font-weight:600;font-size:10px;letter-spacing:2px;color:#8f9bd0;margin-top:2px}
.anv-hicons{display:flex;gap:8px}
.anv-ic{width:32px;height:32px;border-radius:50%;border:1px solid rgba(240,180,41,.3);display:inline-flex;align-items:center;justify-content:center;color:#f0b429;background:rgba(240,180,41,.06);cursor:pointer;text-decoration:none;font-size:14px}
.anv-greet{background:linear-gradient(120deg,rgba(124,58,237,.35),rgba(240,180,41,.12));border:1px solid rgba(240,180,41,.22);border-radius:14px;padding:16px;margin-bottom:14px}
.anv-greet h3{font-family:var(--font-d);font-size:19px;margin:0 0 4px;color:#fff}
.anv-greet p{margin:0;color:#b9c2e8;font-size:13px}
.anv-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.anv-stat{background:rgba(24,32,58,.75);border:1px solid rgba(240,180,41,.18);border-radius:14px;padding:14px}
.anv-stat .k{display:flex;align-items:center;gap:7px;font-size:12px;color:#b9c2e8;margin-bottom:6px}
.anv-stat .k svg{width:16px;height:16px;stroke:#f0b429;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.anv-stat .n{font-family:var(--font-d);font-weight:900;font-size:26px;color:#ffd977}
.anv-stat .s{font-size:11px;color:#7ee2a8;margin-top:3px}
.anv-sec-h{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.anv-sec-h h4{font-family:var(--font-d);font-size:13px;letter-spacing:1.5px;margin:0;color:#fff}
.anv-link{font-size:12px;color:#ffd977;text-decoration:none;cursor:pointer}
.anv-tcard{background:rgba(24,32,58,.75);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;margin-bottom:10px}
.anv-tcard h5{margin:0 0 4px;font-size:15px;color:#fff}
.anv-tcard .meta{font-size:12px;color:#9aa6d6}
.anv-chip{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:6px;vertical-align:2px;margin-right:6px}
.anv-chip.live{background:rgba(239,68,68,.18);color:#ff6b6b;border:1px solid rgba(239,68,68,.4)}
.anv-chip.upcoming{background:rgba(139,92,246,.18);color:#b79cff;border:1px solid rgba(139,92,246,.4)}
.anv-chip.done{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.35)}
.anv-prog{height:6px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.anv-prog i{display:block;height:100%;background:linear-gradient(90deg,#7dd3fc,#38bdf8);border-radius:99px}
.anv-prog-lbl{font-size:10.5px;color:#9aa6d6;text-align:right;margin-top:3px}
.anv-nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(10,14,28,.96);border-top:1px solid rgba(240,180,41,.18);backdrop-filter:blur(8px)}
.anv-nav button{flex:1;background:none;border:0;padding:10px 2px 12px;color:#7c86b3;font-family:var(--font-b);font-size:10px;font-weight:600;letter-spacing:.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.anv-nav button.on{color:#f0b429}
.anv-nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.anv-counts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.anv-count{background:rgba(24,32,58,.75);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;text-align:center}
.anv-count .n{font-family:var(--font-d);font-weight:900;font-size:20px;color:#fff}
.anv-count .l{font-size:10.5px;color:#9aa6d6;letter-spacing:1px;margin-top:2px}
.anv-search{width:100%;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;padding:10px 12px;font-family:var(--font-b);font-size:13px;margin-bottom:12px;box-sizing:border-box}
.anv-prow{display:flex;align-items:center;gap:10px;background:rgba(24,32,58,.75);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;margin-bottom:8px}
.anv-pava{width:40px;height:40px;border-radius:50%;flex:none;background:linear-gradient(135deg,#3d1a78,#7a1020);border:2px solid rgba(240,180,41,.5);display:flex;align-items:center;justify-content:center;font-weight:900;color:#ffd977;font-family:var(--font-d);overflow:hidden}
.anv-pava img{width:100%;height:100%;object-fit:cover}
.anv-pinfo{flex:1;min-width:0}
.anv-pinfo .nm{font-weight:700;font-size:14px;color:#fff}
.anv-pinfo .xp{font-size:11.5px;color:#7dd3fc}
.anv-pact{display:flex;flex-direction:column;gap:5px}
.anv-btn{border:0;border-radius:8px;padding:6px 12px;font-family:var(--font-b);font-weight:700;font-size:11.5px;cursor:pointer;letter-spacing:.5px}
.anv-btn.ban{background:#e11d48;color:#fff}
.anv-btn.unban{background:transparent;color:#7ee2a8;border:1px solid rgba(126,226,168,.5)}
.anv-btn.warn{background:transparent;color:#fbbf24;border:1px solid rgba(251,191,36,.5)}
.anv-btn.edit{background:#2563eb;color:#fff}
.anv-btn.del{background:#ef4444;color:#fff}
.anv-btn.start{background:#22c55e;color:#fff}
.anv-swipe{overflow:hidden;border-radius:12px;margin-bottom:10px}
.anv-swipe-in{display:flex;transition:transform .18s ease}
.anv-swipe-in > .anv-tcard{flex:1 0 100%;margin-bottom:0}
.anv-acts{display:flex;flex-direction:column;gap:6px;justify-content:center;padding:8px;min-width:88px}
.anv-fab{display:block;width:100%;margin-top:6px;background:#2563eb;color:#fff;border:0;border-radius:12px;padding:13px;font-family:var(--font-d);font-weight:700;font-size:13px;letter-spacing:1px;cursor:pointer}
.anv-modal{position:fixed;inset:0;background:rgba(2,4,12,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:18px}
.anv-mbox{background:linear-gradient(165deg,#241440,#150a2a);border:1px solid rgba(240,180,41,.3);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow:auto}
.anv-mbox h4{margin:0 0 12px;font-family:var(--font-d);font-size:15px;color:#ffd977}
.anv-f{margin-bottom:10px}
.anv-f label{display:block;font-size:11px;color:#9aa6d6;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
.anv-f input,.anv-f select,.anv-f textarea{width:100%;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;padding:9px 10px;font-family:var(--font-b);font-size:13.5px;box-sizing:border-box}
.anv-empty{border:1px dashed rgba(240,180,41,.3);border-radius:12px;padding:20px;text-align:center;color:#9aa6d6;font-size:13px;margin-bottom:10px}
.anv-total{background:rgba(24,32,58,.75);border:1px solid rgba(240,180,41,.18);border-radius:14px;padding:16px;margin-bottom:14px}
.anv-total .k{font-size:12px;color:#b9c2e8;margin-bottom:4px}
.anv-total .n{font-family:var(--font-d);font-weight:900;font-size:26px;color:#ffd977}
.anv-total .s{font-size:11.5px;color:#7ee2a8;margin-top:3px}
.anv-deal{display:flex;align-items:center;gap:10px;background:rgba(24,32,58,.75);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;margin-bottom:8px}
.anv-deal .nm{font-weight:700;color:#fff;font-size:14px}
.anv-deal .amt{color:#ffd977;font-weight:700;font-size:13px}
.anv-deal .dt{font-size:11px;color:#9aa6d6}
</style>

<script>
/* XARENA admin nova shell - exact copy of the owner's admin mockups, real data only */
(function () {
  "use strict";
  var LOOK_KEY = "xr_admin_look";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return (n || 0).toLocaleString("en-IN"); }
  function inr(n) { return "₹" + (Number(n) || 0).toLocaleString("en-IN"); }
  var IC = {
    dash: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
    trophy: '<svg viewBox="0 0 24 24"><path d="M7 3h10v5a5 5 0 0 1-10 0z"/><path d="M7 4H4a3 3 0 0 0 3 5M17 4h3a3 3 0 0 1-3 5"/><path d="M12 13v4"/><path d="M8.5 21h7"/></svg>',
    users: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.5a5.5 5.5 0 0 1 5.5 5.5"/></svg>',
    swords: '<svg viewBox="0 0 24 24"><path d="M4 4l7 7M4 4v3M4 4h3"/><path d="M20 4l-7 7M20 4v3M20 4h3"/><path d="M6.5 17.5L4 20l3 3 2.5-2.5"/><path d="M17.5 17.5L20 20l-3 3-2.5-2.5"/><path d="M9 13l2 2M13 9l2 2"/></svg>',
    chart: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/></svg>',
    shield: '<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>',
    dot: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></svg>'
  };
  var TAB_DEFS = [
    ["dashboard", "Dashboard", IC.dash],
    ["tournaments", "Tournaments", IC.trophy],
    ["players", "Players", IC.users],
    ["matches", "Matches", IC.swords],
    ["analytics", "Analytics", IC.chart]
  ];
  var state = { tab: "dashboard", dash: null, players: null, search: "", deals: null, matches: null };

  function api() { return window.xrApi; }
  function rpc(name, args) { return api().rpc(name, args || {}, true); }

  function look() { return localStorage.getItem(LOOK_KEY) || "nova"; }
  function applyLook() {
    var nova = document.getElementById("adm-nova");
    var classic = document.getElementById("adm-classic");
    if (look() === "nova") {
      nova.style.display = ""; classic.style.display = "none";
      if (!state.dash) loadDashboard();
      renderNav(); renderBody();
    } else {
      nova.style.display = "none"; classic.style.display = "";
    }
    var tb = document.getElementById("anv-look-btn");
    if (tb) tb.textContent = look() === "nova" ? "Classic admin" : "Nova admin";
  }
  function renderNav() {
    document.getElementById("anv-nav").innerHTML = TAB_DEFS.map(function (t) {
      return '<button data-tab="' + t[0] + '" class="' + (state.tab === t[0] ? "on" : "") + '">' + t[2] + "<span>" + t[1] + "</span></button>";
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#anv-nav button"), function (b) {
      b.addEventListener("click", function () {
        state.tab = b.getAttribute("data-tab");
        if (state.tab === "dashboard" && !state.dash) loadDashboard();
        if (state.tab === "players" && !state.players) loadPlayers();
        if (state.tab === "analytics" && !state.deals) loadDeals();
        if (state.tab === "matches" && !state.matches) loadMatches();
        renderNav(); renderBody();
      });
    });
  }

  /* ---------- data ---------- */
  function loadDashboard() {
    rpc("admin_dashboard_nova").then(function (d) { if (d && d.ok) { state.dash = d; if (look() === "nova") renderBody(); } });
  }
  function loadPlayers() {
    rpc("admin_players_nova", { p_search: state.search }).then(function (d) { if (d && d.ok) { state.players = d.players; if (look() === "nova") renderBody(); } });
  }
  function loadDeals() {
    rpc("admin_sponsor_deals_list").then(function (d) { if (d && d.ok) { state.deals = d.deals; if (look() === "nova") renderBody(); } });
  }
  function loadMatches() {
    api().aGet("matches", "?select=*,tournaments(name)&order=created_at.desc&limit=30").then(function (rows) {
      state.matches = rows || []; if (look() === "nova") renderBody();
    }).catch(function () { state.matches = []; renderBody(); });
  }

  /* ---------- shared bits ---------- */
  function statusChip(st) {
    if (st === "live") return '<span class="anv-chip live">● LIVE</span>';
    if (st === "upcoming") return '<span class="anv-chip upcoming">UPCOMING</span>';
    return '<span class="anv-chip done">COMPLETED</span>';
  }
  function greetWord() { var h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }
  function modal(title, fieldsHtml, onSave, saveLabel) {
    var root = document.getElementById("anv-modal-root");
    root.innerHTML = '<div class="anv-modal"><div class="anv-mbox"><h4>' + esc(title) + "</h4>" + fieldsHtml +
      '<div style="display:flex;gap:8px;margin-top:14px"><button class="anv-btn start" id="anv-m-save" style="flex:1;padding:11px">' + esc(saveLabel || "Save") + '</button><button class="anv-btn warn" id="anv-m-cancel" style="padding:11px 16px">Cancel</button></div></div></div>';
    document.getElementById("anv-m-cancel").addEventListener("click", function () { root.innerHTML = ""; });
    document.getElementById("anv-m-save").addEventListener("click", function () {
      var btn = this; btn.disabled = true;
      onSave(function () { root.innerHTML = ""; }, function (msg) { btn.disabled = false; alert(msg || "Could not save."); });
    });
  }
  function field(id, label, type, val, opts) {
    if (type === "select") {
      return '<div class="anv-f"><label>' + esc(label) + '</label><select id="' + id + '">' + opts.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === val ? " selected" : "") + ">" + esc(o.charAt(0).toUpperCase() + o.slice(1)) + "</option>";
      }).join("") + "</select></div>";
    }
    if (type === "checkbox") {
      return '<div class="anv-f" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="' + id + '"' + (val ? " checked" : "") + ' style="width:auto"><label for="' + id + '" style="margin:0">' + esc(label) + "</label></div>";
    }
    if (type === "textarea") {
      return '<div class="anv-f"><label>' + esc(label) + '</label><textarea id="' + id + '" rows="3">' + esc(val || "") + "</textarea></div>";
    }
    return '<div class="anv-f"><label>' + esc(label) + '</label><input id="' + id + '" type="' + type + '" value="' + esc(val == null ? "" : val) + '"></div>';
  }
  function val(id) { var e = document.getElementById(id); return e ? e.value : ""; }
  function checked(id) { var e = document.getElementById(id); return e ? e.checked : false; }

  /* ---------- dashboard ---------- */
  function renderDashboard() {
    var d = state.dash;
    if (!d) return '<p style="color:#9aa6d6;text-align:center;padding:30px 0">Loading overview…</p>';
    var recent = (d.recent_tournaments || []).map(function (t) {
      var pct = t.slots > 0 ? Math.min(100, Math.round((t.registered / t.slots) * 100)) : 0;
      return '<div class="anv-tcard">' + statusChip(t.status) + "<h5 style=\"display:inline\">" + esc(t.name) + "</h5>" +
        '<div class="meta">' + esc(t.date_text || "Date to be announced") + " · " + fmt(t.registered) + "/" + fmt(t.slots || 0) + " squads registered</div>" +
        '<div class="anv-prog"><i style="width:' + pct + '%"></i></div></div>';
    }).join("");
    return '<div class="anv-greet"><h3>' + greetWord() + ', Admin</h3><p>Here\'s your esports overview for today</p></div>' +
      '<div class="anv-stats">' +
      '<div class="anv-stat"><div class="k">' + IC.users + "Total Players</div><div class=\"n\">" + fmt(d.players) + '</div><div class="s">↑ +' + fmt(d.players_week) + " this week</div></div>" +
      '<div class="anv-stat"><div class="k">' + IC.trophy + "Active Tournaments</div><div class=\"n\">" + fmt(d.live_tournaments) + '</div><div class="s" style="color:#7dd3fc">● ' + fmt(d.upcoming_tournaments) + " upcoming</div></div></div>" +
      '<div class="anv-sec-h"><h4>Recent Tournaments</h4><a class="anv-link" data-goto="tournaments">See all →</a></div>' +
      (recent || '<div class="anv-empty">No tournaments yet. Create the first one from the Tournaments tab.</div>');
  }

  /* ---------- tournaments ---------- */
  function tourCard(t) {
    var pct = t.slots > 0 ? Math.min(100, Math.round(((t.registered || 0) / t.slots) * 100)) : 0;
    var statusLine = t.status === "live" ? "Live" : (t.status === "upcoming" ? "Upcoming" : "Completed");
    return '<div class="anv-swipe"><div class="anv-swipe-in" data-tid="' + esc(t.id) + '">' +
      '<div class="anv-tcard">' + statusChip(t.status) + '<h5 style="display:inline">' + esc(t.name) + "</h5>" +
      '<div class="meta">' + statusLine + " · " + fmt(t.registered || 0) + "/" + fmt(t.slots || 0) + " squads" + (t.prize ? " · " + esc(t.prize) : "") + "</div>" +

      row.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });

        var dx = e.changedTouches[0].clientX - sx; sx = null;

        row.style.transform = row.style.transform ? "" : "translateX(-96px)";

  /* ---------- analytics (sponsor revenue) ---------- */
  function renderAnalytics() {
    var deals = state.deals;
    if (!deals) return '<p style="color:#9aa6d6;text-align:center;padding:30px 0">Loading sponsor revenue…</p>';
    if (!deals.length) {
      return '<div class="anv-sec-h"><h4>Sponsor Revenue Admin</h4></div>' +
        '<div class="anv-empty">No sponsor deals recorded yet. When a real sponsor signs a deal, add it here - the total, trend chart and sponsor list are built only from these real entries.</div>' +
        '<button class="anv-fab" id="anv-dadd">＋ Add Sponsor Deal</button>';
    }
    var total = deals.reduce(function (s, d) { return s + (Number(d.amount) || 0); }, 0);
    var now = new Date();
    var thisMonth = 0, lastMonth = 0;
    deals.forEach(function (d) {
      var dt = new Date(d.date);
      var mDiff = (now.getFullYear() - dt.getFullYear()) * 12 + (now.getMonth() - dt.getMonth());
      if (mDiff === 0) thisMonth += Number(d.amount) || 0;
      else if (mDiff === 1) lastMonth += Number(d.amount) || 0;
    });
    var cmp = lastMonth > 0 ? '<div class="s">↑ ' + Math.round(((thisMonth - lastMonth) / lastMonth) * 100) + "% vs last month</div>" : "";
    /* 6-month trend */
    var months = [], i;
    for (i = 5; i >= 0; i--) {
      var dt2 = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ key: dt2.getFullYear() + "-" + dt2.getMonth(), label: dt2.toLocaleString("en", { month: "short" }), sum: 0 });
    }
    deals.forEach(function (d) {
      var dt3 = new Date(d.date);
      var key = dt3.getFullYear() + "-" + dt3.getMonth();
      months.forEach(function (m) { if (m.key === key) m.sum += Number(d.amount) || 0; });
    });
    var max = Math.max.apply(null, months.map(function (m) { return m.sum; }).concat([1]));
    var bars = months.map(function (m) {
      var h = Math.max(2, Math.round((m.sum / max) * 90));
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:70%;height:' + h + 'px;background:linear-gradient(180deg,#a78bfa,#7c3aed);border-radius:4px"></div><span style="font-size:10px;color:#9aa6d6">' + m.label + "</span></div>";
    }).join("");
    var list = deals.map(function (d) {
      return '<div class="anv-deal"><div style="flex:1"><div class="nm">' + esc(d.name) + ' <span class="anv-chip upcoming" style="margin-left:4px">' + esc(d.tier || "partner") + '</span></div>' +
        '<div class="dt">' + esc(d.date) + (d.note ? " · " + esc(d.note) : "") + '</div></div>' +
        '<div style="text-align:right"><div class="amt">' + inr(d.amount) + '</div><button class="anv-btn del" data-del="' + d.id + '" style="margin-top:4px;padding:3px 8px;font-size:10px">Delete</button></div></div>';
    }).join("");
    return '<div class="anv-sec-h"><h4>Sponsor Revenue Admin</h4></div>' +
      '<div class="anv-total"><div class="k">Sponsor Contribution</div><div class="n">' + inr(total) + "</div>" + cmp + "</div>" +
      '<div class="anv-sec-h"><h4>Revenue Trend (Last 6 Months)</h4></div>' +
      '<div style="display:flex;align-items:flex-end;height:120px;gap:6px;background:rgba(24,32,58,.5);border-radius:12px;padding:12px">' + bars + "</div>" +
      '<div class="anv-sec-h" style="margin-top:14px"><h4>Sponsor List</h4><a class="anv-link" id="anv-dadd">＋ Add Sponsor</a></div>' + list;
  }
  function wireAnalytics() {
    var add = document.getElementById("anv-dadd");
    if (add) add.addEventListener("click", function () {
      modal("Add Sponsor Deal",
        field("dl-name", "Sponsor / brand name", "text", "") +
        field("dl-tier", "Tier", "select", "partner", ["title", "gold", "partner"]) +
        field("dl-amount", "Amount (₹, real signed deal)", "number", "") +
        field("dl-date", "Deal date", "date", new Date().toISOString().slice(0, 10)) +
        field("dl-note", "Note (optional)", "text", ""),
        function (ok, fail) {
          rpc("admin_sponsor_deal_save", { p_id: null, p_name: val("dl-name").trim(), p_tier: val("dl-tier"), p_amount: parseFloat(val("dl-amount")) || 0, p_note: val("dl-note").trim() || null, p_date: val("dl-date") || null })
            .then(function (r) { if (r && r.ok) { ok(); state.deals = null; loadDeals(); } else fail((r && r.error) || "Save failed."); })
            .catch(function () { fail("Save failed."); });
        }, "Save deal");
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () {
        if (!confirm("Delete this deal entry?")) return;
        rpc("admin_sponsor_deal_delete", { p_id: parseInt(b.getAttribute("data-del"), 10) }).then(function () { state.deals = null; loadDeals(); });
      });
    });
  }

  /* ---------- body router ---------- */
  function renderBody() {
    var el = document.getElementById("anv-body");
    if (state.tab === "dashboard") {
      el.innerHTML = renderDashboard();
      var sa = el.querySelector("[data-goto]");
      if (sa) sa.addEventListener("click", function () { state.tab = "tournaments"; renderNav(); renderBody(); });
    } else if (state.tab === "tournaments") {
      el.innerHTML = renderTournaments();
      if (state.tours) fillTournaments(state.tours); else refreshTours();
      var ts = document.getElementById("anv-tsearch");
      if (ts) ts.addEventListener("input", function () { fillTournaments(state.tours || []); });
      var tc = document.getElementById("anv-tcreate");
      if (tc) tc.addEventListener("click", function () { openTournamentModal(null); });
    } else if (state.tab === "players") {
      el.innerHTML = renderPlayers();
      wirePlayers();
    } else if (state.tab === "matches") {
      el.innerHTML = renderMatches();
    } else if (state.tab === "analytics") {
      el.innerHTML = renderAnalytics();
      wireAnalytics();
    }
  }

  /* ---------- boot: wait for the panel to be visible ---------- */
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    var pv = document.getElementById("panel-view");
    var toggle = document.getElementById("anv-look-btn");
    if (pv && pv.style.display !== "none") {
      clearInterval(iv);
      if (!document.getElementById("anv-look-btn")) {
        var head = pv.querySelector(".section-head");
        if (head) {
          var btn = document.createElement("button");
          btn.className = "btn btn-ghost btn-sm"; btn.id = "anv-look-btn"; btn.style.marginLeft = "10px";
          head.appendChild(btn);
        }
      }
      if (!document.getElementById("anv-look-btn2")) {
        var hic = document.querySelector("#adm-nova .anv-hicons");
        if (hic) {
          var b2 = document.createElement("button");
          b2.id = "anv-look-btn2";
          b2.style.cssText = "border:1px solid rgba(240,180,41,.4);background:rgba(240,180,41,.08);color:#f0b429;border-radius:8px;padding:5px 10px;font-family:var(--font-b);font-weight:700;font-size:11px;cursor:pointer";
          b2.textContent = "Classic admin";
          b2.addEventListener("click", function () {
            localStorage.setItem(LOOK_KEY, "classic");
            applyLook();
          });
          hic.appendChild(b2);
        }
      }
      applyLook();
    } else if (tries > 200) clearInterval(iv);
  }, 400);
  document.getElementById("adm-nova").addEventListener("click", function (e) {
    if (e.target && e.target.id === "anv-look-btn") {
      localStorage.setItem(LOOK_KEY, look() === "nova" ? "classic" : "nova");
      applyLook();
    }
  });
  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "anv-look-btn") {
      localStorage.setItem(LOOK_KEY, look() === "nova" ? "classic" : "nova");
      applyLook();
    }
  });
})();
</script>

</body></html>
