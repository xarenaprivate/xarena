name: Native Android smoke test
# Final staged69 coverage: real poster/certificate renderers and all share launcher shapes.
on:
  workflow_dispatch:
  push:
    branches: [native]
    paths: ['.github/workflows/native-emulator.yml']
permissions:
  contents: read
concurrency:
  group: native-android-smoke
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK and tests (no signing secrets)
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --console=plain -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process -PnativeTestAbi=x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            mkdir -p device-evidence
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w app.xarena.esports.native.test/androidx.test.runner.AndroidJUnitRunner | tee device-evidence/instrumentation.txt
            adb logcat -d > device-evidence/logcat.txt
            adb pull /sdcard/Android/data/app.xarena.esports.native/files/Pictures/ device-evidence/screenshots || true
            grep -q 'OK (' device-evidence/instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-api29-evidence
          path: device-evidence/
          retention-days: 1

  ota-upgrade-verify:
    # Release-gate: verifies the PUBLISHED OTA assets, not a fresh build.
    # 1) apksigner v2 verification of the live 71 base and live 72 target APKs.
    # 2) Real install path: install published 71, then `adb install -r` published 72
    #    on an API 33 emulator (API 30+ enforces v2 signatures for targetSdk 34).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download published APKs
        run: |
          curl -sL -o base71.apk https://github.com/xarenaprivate/xarena/releases/download/v0.17.26-native/xarena-native.apk
          curl -sL -o target72.apk https://github.com/xarenaprivate/xarena/releases/download/v0.17.27-native/xarena-native.apk
          sha256sum base71.apk target72.apk
          echo "122448cf23265cd70c86f4737e383ddcd364921b3406b6c1e7857e753c262254  base71.apk" | sha256sum -c -
          echo "db22cf97f2a01355eeb2abc601e6b6b8daa58e86639b35f978c662166634d306  target72.apk" | sha256sum -c -
      - name: Verify v2 signature scheme on both APKs
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --verbose base71.apk | tee v71.txt
          $APKSIGNER verify --verbose target72.apk | tee v72.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" v71.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" v72.txt
          ZIPALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | tail -1)
          $ZIPALIGN -c 4 base71.apk
          $ZIPALIGN -c 4 target72.apk
      # ARM device install test removed: unaccelerated arm64 emulator images cannot boot on
      # GitHub-hosted runners (two timed-out attempts 2026-11-08). Install-acceptance evidence
      # comes from ota-parse-check (parse) and a real-device trial with explicit caveats.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-upgrade-verify-evidence
          path: device-evidence/
          retention-days: 7


  ota-parse-check:
    # Fast parse evidence on x86_64 (KVM): the release APK ships arm-only ABIs, so the
    # emulator CANNOT install it - the expected outcome is INSTALL_FAILED_NO_MATCHING_ABIS,
    # which proves PackageManager PARSED the package. A parse defect (bad alignment/manifest)
    # instead fails with INSTALL_PARSE_FAILED_*, which this job treats as failure.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download published 72 APK
        run: |
          curl -sL -o target72.apk https://github.com/xarenaprivate/xarena/releases/download/v0.17.27-native/xarena-native.apk
          echo "db22cf97f2a01355eeb2abc601e6b6b8daa58e86639b35f978c662166634d306  target72.apk" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install target72.apk 2>&1 | tee install.txt
            cat install.txt
            adb logcat -d | grep -iE "PackageManager|PackageParser" | tail -30 || true
            if grep -q "INSTALL_PARSE_FAILED" install.txt; then exit 1; fi
            grep -q "INSTALL_FAILED_NO_MATCHING_ABIS" install.txt
