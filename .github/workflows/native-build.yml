name: native-build
on:
  push:
    branches: [native]
  workflow_dispatch:

# Free CI build for the native Android app. No secrets: the release APK is unsigned
# (signing config only activates when keystore/KEY_INFO.txt exists locally). Signing stays local.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests, Paparazzi renders, unsigned release APK
        run: gradle :app:testDebugUnitTest :app:recordPaparazziDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/release/
            app/src/test/snapshots/
            app/build/reports/tests/
