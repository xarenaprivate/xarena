name: native-build
on:
  push:
    branches: [native]
  workflow_dispatch:

# Free CI build for the native Android app. No secrets: the release APK is unsigned
# (signing config only activates when keystore/KEY_INFO.txt exists locally). Signing stays local.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests, Paparazzi renders, unsigned release APK, debug APK
        run: gradle :app:testDebugUnitTest :app:recordPaparazziDebug :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/apk/debug/
            app/src/test/snapshots/
            app/build/reports/tests/

  emu-smoke:
    # DEBUG smoke only: installs the debug-signed APK on a free CI emulator, launches the app,
    # and screenshots it. This is NOT release verification and NOT an authenticated session.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build x86_64 debug APK for emulator
        run: gradle assembleDebug -PnativeTestAbi=x86_64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          force-avd-creation: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p app.xarena.esports.native -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > emu-login.png
            adb shell pidof app.xarena.esports.native
      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-smoke
          if-no-files-found: warn
          path: emu-login.png
