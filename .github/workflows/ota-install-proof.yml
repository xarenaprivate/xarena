name: ota-install-proof
on:
  push:
    branches: [native]
    paths: ['.github/workflows/ota-install-proof.yml']
  workflow_dispatch:

jobs:
  install-proof:
    # Decisive install experiment on fast KVM x86_64 with a Google Play image that ships
    # ARM->x86 native translation: install known-good 71 (control), published 72 (expected
    # failure: .so page misalignment + extractNativeLibs=false), and the page-aligned
    # candidate (expected success). Real PackageManager install incl. native extraction.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download APKs
        run: |
          curl -sL -o base71.apk https://github.com/xarenaprivate/xarena/releases/download/v0.17.26-native/xarena-native.apk
          curl -sL -o published72.apk https://github.com/xarenaprivate/xarena/releases/download/v0.17.27-native/xarena-native.apk
          curl -sL -o candidate.apk https://github.com/xarenaprivate/xarena/releases/download/v0.17.27-native/xarena-native-candidate.apk
          echo "122448cf23265cd70c86f4737e383ddcd364921b3406b6c1e7857e753c262254  base71.apk" | sha256sum -c -
          echo "efcd8caaf99410aa8ea779405d7f3d940e150236555722b46b4181b5ea240e8b  published72.apk" | sha256sum -c -
          echo "db22cf97f2a01355eeb2abc601e6b6b8daa58e86639b35f978c662166634d306  candidate.apk" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          script: |
            adb wait-for-device
            sleep 10
            adb shell getprop sys.boot_completed
            echo "== translation presence =="
            adb shell getprop ro.dalvik.vm.native.bridge
            adb shell getprop ro.enable.native.bridge.exec
            adb shell "ls /system/lib64/arm64 2>/dev/null | head -3" || true
            echo "== control 71 (expect Success) =="
            adb install base71.apk 2>&1 | tee i71.txt
            echo "== published 72 (expect Failure: extract native libraries) =="
            adb install published72.apk 2>&1 | tee i72.txt || true
            echo "== candidate (expect Success) =="
            adb install candidate.apk 2>&1 | tee ic.txt
            echo "== PackageManager logcat =="
            adb logcat -d | grep -iE "PackageManager|installd|native librar" | tail -30 || true
            echo "== SUMMARY =="
            grep -E "Success|Failure" i71.txt i72.txt ic.txt || true
            grep -q Success i71.txt
            grep -q Success ic.txt
